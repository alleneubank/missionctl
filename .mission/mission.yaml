mission: 1
id: mission-control-arc
title: Finish the mission-control arc through a bugbash and report its effect on Allen's AI usage
outcome: "Every supported harness resumes a campaign from one committed LOOP.md through the same bounded missionctl projection, the tool is installed fleet-wide through mise, every GitHub issue open during the 2026-09-01 bugbash kickoff (#2 through #6) is resolved under its native acceptance criteria with regression evidence, and an evidence-backed Recall retrospective reports what the machinery changed about scope stability, context efficiency, human gates, and agent autonomy."
rubric:
  - id: CONTRACT-001
    criterion: The LOOP-first missionctl contract validates, projects, and transitions from the repository alone, reviewed and merged.
    floor: npm run check green, an independent review with no major-or-higher finding, and PR #1 merged to main.
    status: met
    evidence: "PR #1 rebase-merged as 2a3de93; CI run 33270300793 green (npm run check, package); review round 8 (rl review, claude) no major finding"
  - id: CONSUMERS-001
    criterion: agent-profile doctrine and skills, agent-statusline, Codex /mission, and dotfiles consume the bounded missionctl projection without duplicating reducers or injecting unbounded loops.
    floor: Each repository's own harness passes against the landed contract and its draft PR is refreshed with the ordered dependency chain.
    status: met
    evidence: "against v0.1.0-rc.2 on 2026-08-29: agent-profile #2 merged (717c5f2, npm run check 23/23), agent-statusline #2 merged (e8bb06e, zig build test + check-missionctl-smoke.sh), codex #1 merged into the fork main (8cb00361a0, 5 mission tests), dotfiles #12 merged (ee66a83, test-missionctl-mise.sh)"
  - id: PUBLISH-001
    criterion: A missionctl release installs reproducibly through the committed mise lock and marketplace plugin.
    floor: Tagged release asset, checksum, and lock entry agree; dotfiles convergence passes.
    status: met
    evidence: "v0.1.0-rc.2 pre-release asset sha256 71509f15… matches dotfiles mise.lock (ee66a83); dotfiles-sync converged ae-dev, pixelproton, fll-practice, onyx on 2026-08-29 with missionctl resolving to the mise shim and plugin 0.1.0-rc.2 installed"
  - id: DOGFOOD-001
    criterion: The landed system drives real attended and unattended campaigns across Codex, Claude, Pi, RL, and Sox work for one to two weeks.
    floor: At least one full start → compact → close cycle per harness class on real work, with defects filed as loop blockers or fixed.
    status: open
  - id: ISSUE-002
    criterion: "GitHub issue #2 is resolved: routing a decision never homogenizes a standing document with mixed line endings."
    floor: A regression test observes the pre-fix whole-document rewrite and proves that routing changes only the Decisions section bytes, the targeted and full harnesses pass, a fresh reviewer reports no major-or-higher finding, and the issue is closed.
    status: open
  - id: ISSUE-003
    criterion: "GitHub issue #3 is resolved: compact and close preparation makes a materially similar existing Decisions entry visible before the driver chooses a routing disposition."
    floor: SPEC.md defines the similarity warning and its false-positive boundary, tests observe the missing warning and cover both a paraphrase and a permitted neighboring entry, the targeted and full harnesses pass, a fresh reviewer reports no major-or-higher finding, and the issue is closed.
    status: open
  - id: ISSUE-004
    criterion: "GitHub issue #4 is resolved: discovery tolerates unrelated dangling symlinks without weakening fail-closed handling of contract artifacts."
    floor: A hermetic fixture proves check, inspect, and mission discovery resolve the real artifacts around unrelated dangling file and directory symlinks while dangling LOOP.md or mission.yaml artifacts remain visible failures; the bounded deterministic walk, full harness, and fresh major-floor review pass; the issue is closed.
    status: open
  - id: ISSUE-005
    criterion: "GitHub issue #5 is resolved: a repo-local .zig-global-cache cannot consume the bounded campaign-discovery walk."
    floor: A regression fixture with more than 10000 ignored-cache directories observes the pre-fix discovery-bound failure and then discovers the campaign successfully, a control fixture exceeding the unignored-directory bound still fails closed, the full harness and fresh major-floor review pass, and the issue is closed.
    status: open
  - id: ISSUE-006
    criterion: "GitHub issue #6 is resolved: an ordinary file-heavy source tree cannot consume the bounded campaign-discovery walk."
    floor: A regression fixture with more than 10000 ordinary files observes the pre-fix discovery-bound failure and then discovers the campaign successfully, the walk retains an explicit 10000-directory fail-closed bound, the full harness and fresh major-floor review pass, and the issue is closed.
    status: open
  - id: RETRO-001
    criterion: A Recall-backed retrospective compares sessions before and after rollout on scope stability, boundary fidelity, evidence-backed done claims, context growth, re-litigated decisions, rescues and early stops, gate latency, attended versus unattended behavior, and attention identification.
    floor: Corpus dates and sampling stated, representative sessions cited, observation separated from inference, limitations recorded, keep/change/stop actions and doctrine amendments proposed; no universal productivity score.
    status: open
boundary:
  - publish
  - merge-tracked-ref
  - release-tag
